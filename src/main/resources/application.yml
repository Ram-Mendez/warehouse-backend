spring:
  application:
    name: warehouse-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET lock_timeout='5s'; SET statement_timeout='30s'
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns schema changes; Hibernate only checks mappings at startup.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # V1 -> V2 -> ... are append-only: stored checksums detect changed deployed SQL.
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  # Finish in-flight requests on SIGTERM; the container stop timeout must exceed 30s.
  shutdown: graceful

security:
  jwt:
    issuer: warehouse-backend
    access-token-ttl: PT45M
    refresh-token-ttl: P7D
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public probes reveal availability only, even when a caller sends a JWT.
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Transactional warehouse inventory API

springdoc:
  # Include package and enclosing DTO names to distinguish nested Input/Response records.
  use-fqn: true
  swagger-ui:
    persist-authorization: false
    try-it-out-enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
