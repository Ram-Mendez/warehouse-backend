spring:
  application:
    name: warehouse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/warehouse}
    username: ${DB_USERNAME:warehouse}
    password: ${DB_PASSWORD:warehouse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    issuer: warehouse-backend
    access-token-ttl: PT45M
    refresh-token-ttl: P7D

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when_authorized
